[project]
name = "us-stocks-portfolio-report"
version = "1.1.0"
description = "Generate current-year and all-time portfolio performance workbooks"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openpyxl>=3.1,<4",
    "pandas>=3.0,<4",
    "xlrd>=2.0,<3",
    "xlsxwriter>=3.2,<4",
    "yfinance>=1.6,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
exclude = [".venv", "reports_directory", "output"]
